name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build & publish release zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check versions (manifest.json, package.json = tag)
        run: |
          manifest=$(python3 -c "import json; print(json.load(open('custom_components/island_energy/manifest.json'))['version'])")
          card=$(python3 -c "import json; print(json.load(open('package.json'))['version'])")
          if [ "v$manifest" != "$GITHUB_REF_NAME" ] || [ "v$card" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME nesedí s manifest.json ($manifest) nebo package.json ($card)"; exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      # Bundle karet patří do integrace (custom_components/island_energy/frontend/).
      - run: npm run build
      # HACS (zip_release) čeká v zipu přímo soubory integrace, ne složku.
      - name: Pack integration
        run: |
          cd custom_components/island_energy
          zip -r "$GITHUB_WORKSPACE/island_energy.zip" . -x "__pycache__/*" "*/__pycache__/*"
          unzip -l "$GITHUB_WORKSPACE/island_energy.zip"
      # Text vydání = sekce „## <tag>“ z CHANGELOG.md (HACS / HA ho ukáže v okně
      # aktualizace). Bez sekce zůstanou jen automaticky generované poznámky.
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v tag="$GITHUB_REF_NAME" '
            $1 == "##" { if (found) exit; if ($2 == tag) { found = 1; next } }
            found
          ' CHANGELOG.md > release-notes.md
          if [ -s release-notes.md ]; then
            echo "Release notes for $GITHUB_REF_NAME:"; cat release-notes.md
          else
            echo "::warning::CHANGELOG.md nemá sekci ## $GITHUB_REF_NAME"
          fi
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: island_energy.zip
          body_path: release-notes.md
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
